onboarding = false

[theme]
name = "catppuccin-latte"
auto_switch = false

[theme.custom]
panel_bg = "#eff1f5"
sidebar_bg = "#e6e9ef"
active_row_bg = "#ccd0da"
text = "#4c4f69"

[terminal]
new_cwd = "follow"

[ui]
mouse_capture = true
sidebar_width = 20
sidebar_min_width = 16
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
tab_bar_right_separator = " | "

tab_bar_right = [
  { type = "command", command = "node %USERPROFILE%\\.gemini\\antigravity-cli\\get_quota_summary.js", interval_seconds = 5, timeout_seconds = 2 },
  { type = "zoom" }
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
switch_ascii_input_source_in_prefix = true

# 빠른 실행 단축키
[[keys.command]]
key = "alt+a"
type = "pane"
command = "agy --mode auto"

[[keys.command]]
key = "alt+c"
type = "pane"
command = "claude"

[[keys.command]]
key = "alt+d"
type = "pane"
command = "codex"

# Alt+q : 안티그래비티 5시간/주간 사용량 팝업 확인
[[keys.command]]
key = "alt+q"
type = "popup"
command = "\"%LOCALAPPDATA%\\agy\\bin\\agy.exe\" -p /quota & pause"
width = "80%"
height = "50%"
